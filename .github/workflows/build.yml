name: Build

# Builds exult.3dsx with devkitARM (in Docker, via build/build.sh) on every
# push. Each run uploads the ready-to-use folder (SD layout + Wi-Fi installer)
# as an artifact. A GitHub Release is published when a tag like v0.1.0 is
# pushed, or from the Actions tab: "Run workflow" with a version filled in
# (GitHub creates the tag). Versions with a suffix (v0.1.0-rc1) are marked
# pre-release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version (e.g. v0.1.0). Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build Exult for New 3DS
        run: bash build/build.sh

      - name: Assemble release folder
        run: |
          D=dist/exult-3ds
          mkdir -p "$D/SD/3ds/exult"
          cp build/out/exult.3dsx "$D/SD/3ds/exult/"
          cp -r build/out/data "$D/SD/3ds/exult/"
          cp Install-Exult.cmd Exult-3DS.cmd Deploy-Exult.ps1 Copy-U7-To-3DS.ps1 README.md TESTING.md LICENSE THIRD_PARTY_NOTICES.txt "$D/"
          # Licence files must ship in every zip: Exult's COPYING (GPL v2) and the
          # notices of the statically linked libraries.
          cp build/work/exult/COPYING "$D/COPYING"
          for f in LICENSE COPYING THIRD_PARTY_NOTICES.txt; do test -s "$D/$f" || { echo "missing $f"; exit 1; }; done
          ls -la "$D" "$D/SD/3ds/exult"

      - name: Publish to builds branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p out
          cp build/out/exult.3dsx out/
          cp -r build/out/data out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          # main publishes to `builds` (what gets installed); other branches to builds-<branch>
          dest=builds; [ "$GITHUB_REF_NAME" = main ] || dest="builds-${GITHUB_REF_NAME//\//-}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "builds:$dest"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota can be full; the builds branch has the binary
        with:
          name: exult-3ds-${{ github.sha }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          cd dist
          zip -r "exult-3ds-${VERSION}.zip" exult-3ds
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac   # v0.1.0-rc1 etc.
          gh release create "$VERSION" "exult-3ds-${VERSION}.zip" $pre --target "$GITHUB_SHA" \
            --title "Exult for New 3DS ${VERSION}" --generate-notes
