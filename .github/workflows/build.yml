name: Build

# Builds exult.3dsx with devkitARM (in Docker, via build/build.sh) on every
# push. Each run uploads the ready-to-use folder (SD layout + Wi-Fi installer)
# as an artifact; pushing a tag like v0.1.0 also publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build Exult for New 3DS
        run: bash build/build.sh

      - name: Assemble release folder
        run: |
          D=dist/exult-3ds
          mkdir -p "$D/SD/3ds/exult"
          cp build/out/exult.3dsx "$D/SD/3ds/exult/"
          cp -r build/out/data "$D/SD/3ds/exult/"
          cp Install-Exult.cmd Exult-3DS.cmd Deploy-Exult.ps1 Copy-U7-To-3DS.ps1 README.md TESTING.md LICENSE "$D/"
          ls -la "$D" "$D/SD/3ds/exult"

      - uses: actions/upload-artifact@v4
        with:
          name: exult-3ds-${{ github.sha }}
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -r "exult-3ds-${GITHUB_REF_NAME}.zip" exult-3ds
          gh release create "$GITHUB_REF_NAME" "exult-3ds-${GITHUB_REF_NAME}.zip" \
            --title "Exult for New 3DS ${GITHUB_REF_NAME}" --generate-notes
